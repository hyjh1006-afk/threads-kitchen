name: daily-threads-kitchen

on:
  schedule:
    - cron: "20 2 * * *"   # 11:20 KST (UTC+9) — 점심 직전, 무료 러너 특성상 지연 가능
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write           # 이미지·상태 커밋용

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: git 계정 설정 (이미지 자동 푸시용)
        run: |
          git config user.name "threads-kitchen-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: 자동 게시 실행
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_auto.py

      - name: 상태 커밋 (menus.json used 표시 등)
        run: |
          git add menus.json images || true
          git diff --cached --quiet || git commit -m "자동 게시 기록 $(date -u +%F)"
          git pull --rebase origin main || true
          git push || true
